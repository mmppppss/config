; ═══════════════════════════════════════════════
;  POLYBAR — caelestia-shell, versión gruvbox
;  Barra superior flotante tipo píldora, casi vacía.
;  Centrada con offset-x 3% (94% de ancho, gaps iguales).
;  Puntos de workspaces · título tenue · reloj · estado · power
; ═══════════════════════════════════════════════

[colors]
background      = #f01d1d1d
background-alt  = #3c3836
foreground      = #ebdbb2
foreground-dim  = #a89984
primary         = #d79921
secondary       = #98971a
alert           = #fb4934
disabled        = #665c54

[bar/main]
width = 98%
height = 30
offset-x = 1%
offset-y = 6
radius = 10
fixed-center = true

top = true
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
border-size = 1
border-color = #59443a

padding-left = 3
padding-right = 3
module-margin = 1.3

scroll-up = bspwm-desknext
scroll-down = bspwm-deskprev

font-0 = Hack Nerd Font Mono:size=10;2
font-1 = FontAwesome:size=10;2
font-2 = Symbols Nerd Font:size=10;2
font-3 = Noto Sans CJK JP:size=10;2

modules-left = bspwm xwindow
modules-center = clock
modules-right = wlan eth pulseaudio cpu memory battery tray power

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm
override-redirect = false

; ── workspaces como puntos (solo usados) ──
[module/bspwm]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true

label-active = ●
label-active-foreground = ${colors.primary}
label-active-padding = 1

label-occupied = ○
label-occupied-foreground = ${colors.foreground-dim}
label-occupied-padding = 1

label-urgent = ●
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

label-empty =
label-empty-padding = 0

label-separator =  
label-separator-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:38:...%
label-foreground = ${colors.foreground-dim}
label-padding = 2

[module/clock]
type = custom/script
interval = 1
exec = /home/mps/.config/scripts/clock.sh
label = %output%
label-foreground = ${colors.foreground}
format-padding = 2
click-left = sh /home/mps/.config/scripts/calpanel.sh

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected-prefix = "%{T1} %{T-}"
format-connected-prefix-foreground = ${colors.primary}
label-connected = %signal%%
format-disconnected-prefix = "%{T2}󰤮 %{T-}"
format-disconnected-prefix-foreground = ${colors.disabled}
format-disconnected =
format-padding = 1

[module/eth]
type = internal/network
interface-type = wired
interval = 3
format-connected-prefix = "%{T1} %{T-}"
format-connected-prefix-foreground = ${colors.primary}
label-connected = 
format-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.primary}
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
click-right = pavucontrol &
format-muted-prefix = "%{T2}󰝤 %{T-}"
format-muted-prefix-foreground = ${colors.alert}
label-muted = off
label-muted-foreground = ${colors.disabled}
format-padding = 1

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
poll-interval = 30
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹
ramp-capacity-foreground = ${colors.primary}
animation-charging-0 = 󰢝
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰂉
animation-charging-5 = 󰢞
animation-charging-foreground = ${colors.primary}
animation-charging-framerate = 750
format-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage%%
format-padding = 1

[module/memory]
type = custom/script
exec = awk '/^MemTotal:/{t=$2}/^MemAvailable:/{a=$2}END{printf "%.1f", (t-a)/1048576}' /proc/meminfo
interval = 5
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %output%G
format-padding = 1

[module/tray]
type = internal/tray
tray-spacing = 6
tray-size = 22
tray-scale = 1.0
tray-background = ${colors.background}
tray-padding = 2

[module/power]
type = custom/text
format = %{T1}%{T-}
format-foreground = ${colors.primary}
click-left = sh ~/.config/rofi/applets/applets/powermenu.sh
click-right = sh ~/.config/rofi/applets/applets/archmenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = false
